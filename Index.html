<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFCF6">
<title>Spelling Bee · G3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6;--ink:#45413D;--coral:#F2A497;--yellow:#F6D27A;
  --blue:#A8D3E6;--green:#B9DAA5;--line:#5B554E;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background-color:var(--paper);color:var(--ink);
  font-family:"Huninn",ui-rounded,system-ui,sans-serif;
  background-image:
    radial-gradient(#dfd3c2 0.7px,transparent 0.7px),
    radial-gradient(#f0dfd2 0.55px,transparent 0.55px);
  background-position:0 0, 6px 7px;
  background-size:17px 17px, 23px 23px;
}
button,input{font:inherit}
.app{width:min(100%,560px);margin:0 auto;padding:22px 20px 34px;min-height:100svh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px}
.bee{width:42px;height:42px;border:2px solid var(--line);border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:23px;transform:rotate(-9deg);box-shadow:3px 3px 0 var(--line)}
.grade{border:2px solid var(--line);border-radius:999px;padding:6px 13px;background:#fff;font-size:14px;letter-spacing:1px}
h1{font-size:clamp(34px,9vw,48px);line-height:1;margin:25px 0 4px;letter-spacing:-1px}
.subtitle{font-size:14px;letter-spacing:3px;color:#8b8176;margin:0 0 23px}
.progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.progress{height:10px;background:#eee5d9;border:1.5px solid var(--line);border-radius:20px;overflow:hidden;flex:1}
.progress>div{height:100%;width:0;background:var(--green);transition:width .3s}
.counter{font-size:13px;white-space:nowrap}
.card{background:#fffefa;border:2px solid var(--line);border-radius:28px 24px 30px 22px;padding:24px 20px 22px;box-shadow:4px 5px 0 #d9cbb8;position:relative;text-align:center}
.card:before,.card:after{content:"";position:absolute;width:17px;height:17px;border:2px solid var(--line);border-radius:50%;background:var(--coral);top:-9px}
.card:before{left:25px}.card:after{right:25px;background:var(--blue)}
.prompt{font-size:14px;color:#8c8278;margin:2px 0 18px;letter-spacing:1px}
.listen{width:100%;min-height:66px;border:2px solid var(--line);border-radius:17px;background:var(--blue);box-shadow:0 4px 0 var(--line);font-size:19px;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:transform .1s,box-shadow .1s}
.listen:active,.action:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.listen .speaker{font-size:25px}
.input-label{display:block;text-align:left;font-size:14px;margin:24px 0 8px 3px;color:#746b62}
.answer{width:100%;height:58px;border:2px solid var(--line);border-radius:15px;background:#fffdf9;padding:0 16px;text-align:center;font-size:24px;letter-spacing:1px;outline:none}
.answer:focus{box-shadow:0 0 0 4px #A8D3E655}
.answer:disabled{background:#f4f0e8;color:#777}
.action{width:100%;height:54px;border:2px solid var(--line);border-radius:15px;background:var(--yellow);box-shadow:0 4px 0 var(--line);font-size:18px;margin-top:17px;cursor:pointer}
.action.next{background:var(--green)}
.feedback{min-height:35px;margin:17px 0 0;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.feedback.good{color:#39744c}.feedback.bad{color:#ad6257}
.hidden{display:none!important}
.footer{margin-top:auto;padding-top:24px;text-align:center;color:#9a9085;font-size:12px;letter-spacing:1px}
.dance-floor{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.dancer{position:absolute;bottom:-70px;font-size:clamp(28px,8vw,42px);animation:party 2.2s ease-out forwards}
@keyframes party{0%{transform:translateY(0) rotate(0) scale(.5);opacity:0}15%{opacity:1}50%{transform:translateY(-48vh) rotate(20deg) scale(1.15)}100%{transform:translateY(-110vh) rotate(-25deg) scale(.8);opacity:0}}
.rabbit{position:absolute;left:50%;top:50%;font-size:clamp(34px,9vw,48px);transform:translate(-50%,-50%);animation:rabbitCircle 1.65s ease-in-out forwards;filter:drop-shadow(1px 2px 0 #fff)}
.rabbit span{display:block;animation:rabbitBounce .32s ease-in-out infinite alternate}
@keyframes rabbitCircle{0%{transform:translate(-50%,-50%) translate(0,-105px) scale(.7);opacity:0}10%{opacity:1}20%{transform:translate(-50%,-50%) translate(74px,-74px) scale(1)}30%{transform:translate(-50%,-50%) translate(105px,0) scale(1)}40%{transform:translate(-50%,-50%) translate(74px,74px) scale(1)}50%{transform:translate(-50%,-50%) translate(0,105px) scale(1)}60%{transform:translate(-50%,-50%) translate(-74px,74px) scale(1)}70%{transform:translate(-50%,-50%) translate(-105px,0) scale(1)}80%{transform:translate(-50%,-50%) translate(-74px,-74px) scale(1)}100%{transform:translate(-50%,-50%) translate(0,-105px) scale(.7);opacity:0}}
@keyframes rabbitBounce{from{translate:0 0}to{translate:0 -13px}}
.sparkle{position:absolute;font-size:25px;animation:twinkle 1.2s ease-out forwards}
@keyframes twinkle{0%{transform:scale(.2) rotate(0);opacity:0}35%{opacity:1}100%{transform:scale(1.4) rotate(100deg);opacity:0}}
@media(min-width:520px){.app{padding-top:34px}.card{padding:30px 32px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="bee" aria-hidden="true">🐝</div><span>WORD PRACTICE</span></div>
    <div class="grade">G3</div>
  </header>
  <h1>Spelling Bee</h1>
  <p class="subtitle">LISTEN · SPELL · HOP</p>
  <div class="progress-wrap">
    <div class="progress"><div id="progressFill"></div></div>
    <span class="counter" id="counter">0 / 90</span>
  </div>

  <main class="card">
    <p class="prompt" id="prompt">TAP TO HEAR YOUR WORD</p>
    <button class="listen" id="listenBtn" type="button"><span class="speaker">🔊</span><span>Hear the word</span></button>
    <label class="input-label" for="answer">TYPE THE WORD</label>
    <input class="answer" id="answer" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" placeholder="Your spelling...">
    <button class="action" id="checkBtn" type="button">Check spelling</button>
    <button class="action next hidden" id="nextBtn" type="button">Next word →</button>
    <p class="feedback" id="feedback" aria-live="polite"></p>
  </main>
  <footer class="footer">TAKE YOUR TIME · YOU'VE GOT THIS!</footer>
</div>
<div class="dance-floor" id="danceFloor" aria-hidden="true"></div>
<script>
const WORDS = `absolute actual adopt amiss anew applesauce astray awful bloodhound capture carefree clump cobweb concern conduct course crystal egret farther fiber fortune fountain gentle glory godfather greenhouse handsome hollow honest joined kingdom liberty limit location loose magnet meaning metal midnight mink mistreat misuse moral motion murder noble observe occur odor oneself operate oriole otherwise pause perfume pollute powder prefer prevent private proper provide recent reduce regular royal rumble sailor scatter scent seize servant shoplift silkworm skyrocket snowstorm sputter steady straight sturdy style surface sweat tangle task tease temple thief thigh tour twice union usual vapor volum wander wealth whenever wound zigzag`.split(/\s+/);

let deck=[], index=0, locked=false, correct=0;
const $=id=>document.getElementById(id);
const listenBtn=$('listenBtn'), answer=$('answer'), checkBtn=$('checkBtn'), nextBtn=$('nextBtn');
const feedback=$('feedback');
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function updateProgress(){
  $('progressFill').style.width=(correct/WORDS.length*100)+'%';
  $('counter').textContent=`${correct} / ${WORDS.length}`;
}
function speak(){
  if(!('speechSynthesis' in window)){feedback.textContent='Audio is not supported in this browser.';return}
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(deck[index]);
  utterance.lang='en-US';utterance.rate=0.5;
  const voices=speechSynthesis.getVoices();
  const american=voices.find(v=>v.lang==='en-US' && /Samantha|Aria|Jenny|Google US English/i.test(v.name)) || voices.find(v=>v.lang==='en-US');
  if(american)utterance.voice=american;
  speechSynthesis.speak(utterance);
}
function loadQuestion(){
  if(index>=deck.length){finish();return}
  locked=false;answer.disabled=false;answer.value='';answer.focus({preventScroll:true});
  $('prompt').textContent='TAP TO HEAR YOUR WORD';
  listenBtn.classList.remove('hidden');checkBtn.classList.remove('hidden');nextBtn.classList.add('hidden');
  feedback.textContent='';feedback.className='feedback';
  updateProgress();
}
function makeFart(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const duration=.55, osc=ctx.createOscillator(), gain=ctx.createGain(), filter=ctx.createBiquadFilter();
    osc.type='sawtooth';filter.type='lowpass';filter.frequency.value=240;
    osc.frequency.setValueAtTime(115,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(42,ctx.currentTime+duration);
    gain.gain.setValueAtTime(.0001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.24,ctx.currentTime+.04);
    gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);
    osc.connect(filter);filter.connect(gain);gain.connect(ctx.destination);
    osc.start();osc.stop(ctx.currentTime+duration);
    osc.onended=()=>ctx.close();
  }catch(e){}
}
function cheer(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const notes=[659,784,988,1319];
    notes.forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,ctx.currentTime+i*.09);
      g.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+i*.09+.025);
      g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+i*.09+.22);
      o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*.09);o.stop(ctx.currentTime+i*.09+.24);
    });
    setTimeout(()=>ctx.close(),900);
  }catch(e){}
}
function celebrate(){
  const floor=$('danceFloor');
  const bunnies=['🐰','🐇','🐰','🐇','🐰','🐰'];
  bunnies.forEach((bunny,i)=>{
    const el=document.createElement('div');
    el.className='rabbit';
    el.style.animationDelay=(i*.07)+'s';
    el.innerHTML='<span>'+bunny+'</span>';
    floor.appendChild(el);
    setTimeout(()=>el.remove(),2300);
  });
  for(let i=0;i<12;i++){
    const el=document.createElement('span');el.className='sparkle';
    el.textContent=['✿','✨','♡','⭐'][i%4];
    el.style.left=(Math.random()*90+5)+'%';
    el.style.top=(Math.random()*72+8)+'%';
    el.style.animationDelay=(Math.random()*.35)+'s';
    floor.appendChild(el);
    setTimeout(()=>el.remove(),1800);
  }
}
function check(){
  if(locked)return;
  const typed=answer.value.trim().toLowerCase();
  if(!typed){feedback.textContent='Type your spelling first!';feedback.className='feedback bad';answer.focus();return}
  if(typed===deck[index].toLowerCase()){
    locked=true;correct++;answer.disabled=true;
    feedback.textContent='✦ Amazing! That is correct! ✦';feedback.className='feedback good';
    $('prompt').textContent='GREAT JOB!';
    checkBtn.classList.add('hidden');nextBtn.classList.remove('hidden');listenBtn.classList.add('hidden');
    cheer();celebrate();updateProgress();
  }else{
    feedback.textContent='Oops! Try again!';feedback.className='feedback bad';
    makeFart();answer.select();
  }
}
function finish(){
  $('prompt').textContent='YOU DID IT!';
  listenBtn.classList.add('hidden');checkBtn.classList.add('hidden');nextBtn.classList.add('hidden');
  answer.classList.add('hidden');$('answer').previousElementSibling.classList.add('hidden');
  feedback.textContent=`🏆 All ${WORDS.length} words completed. Fantastic work!`;
  feedback.className='feedback good';
  const restart=document.createElement('button');restart.className='action next';restart.textContent='Practice again ↻';
  restart.onclick=()=>{deck=shuffle(WORDS);index=0;correct=0;answer.classList.remove('hidden');$('answer').previousElementSibling.classList.remove('hidden');restart.remove();loadQuestion()};
  $('feedback').after(restart);updateProgress();
}
listenBtn.addEventListener('click',speak);
checkBtn.addEventListener('click',check);
nextBtn.addEventListener('click',()=>{index++;loadQuestion()});
answer.addEventListener('keydown',e=>{if(e.key==='Enter'){if(!checkBtn.classList.contains('hidden'))check();else if(!nextBtn.classList.contains('hidden')){index++;loadQuestion()}}});
deck=shuffle(WORDS);updateProgress();loadQuestion();
if('speechSynthesis' in window)speechSynthesis.getVoices();
</script>
</body>
</html>
